[package]
name = "pen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pen, a code editor that feels like a pen on paper."

[lib]
name = "pen"
path = "src/lib.rs"

[[bin]]
name = "pen"
path = "src/main.rs"

[features]
default = ["plugins"]
plugins = ["pen-plugins/host"]

[dependencies]
buffer = { path = "../buffer" }
highlight = { path = "../highlight" }
pen-acp = { path = "../acp" }
pen-plugins = { path = "../plugins", default-features = false }
pen-term = { path = "../term" }
pen-lsp = { path = "../lsp" }
pen-git = { path = "../git" }
project = { path = "../project" }
rune.workspace = true
serde_json.workspace = true
rune-kit.workspace = true
tokio.workspace = true

[lints]
workspace = true

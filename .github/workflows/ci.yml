name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon · aarch64)
            os: macos-14
            target: aarch64-apple-darwin
            run_tests: true
          - label: macOS (Intel · x86_64)
            os: macos-14
            target: x86_64-apple-darwin
            run_tests: false
          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            run_tests: true
          - label: Windows (ARM64 · aarch64)
            os: windows-latest
            target: aarch64-pc-windows-msvc
            run_tests: false
          - label: Linux (x86_64)
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            run_tests: true
          - label: Linux (ARM64 · aarch64)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            run_tests: true

    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 mesa-vulkan-drivers

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Format check
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo fmt --all -- --check

      - name: Clippy (${{ matrix.target }})
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Build release binary (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }} -p pen

      - name: Unit & headless tests
        if: matrix.run_tests
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          cargo test --lib --workspace
          cargo test --release -p buffer -- --ignored --nocapture
